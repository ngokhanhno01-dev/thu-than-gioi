/* CHỈ CHƠI BẢN ĐÃ TẢI VỀ MÁY (PWA). Mở bằng trình duyệt thường -> tự chuyển về trang chủ để tải. */
(function(){
  function mm(q){try{return matchMedia(q).matches}catch(e){return false}}
  var app=mm('(display-mode: fullscreen)')||mm('(display-mode: standalone)')||mm('(display-mode: minimal-ui)')||mm('(display-mode: window-controls-overlay)')||navigator.standalone===true;
  window.TTG_APP=app;
  if(!app){
    window.TTG_BLOCK=true;
    document.documentElement.style.visibility='hidden';
    try{location.replace(new URL('trang-chu/?can-cai=1',document.baseURI).href)}catch(e){location.href='../trang-chu/?can-cai=1'}
  }
})();
</script>

<style id="boot-css">
/* MÀN CHỜ (game chỉ có màn ngang): ảnh nền phủ toàn màn hình, thanh tiến trình ở đáy;
   tải xong thì chữ "Chạm vào màn hình để vào Thú Thần Giới" nổi giữa màn hình, chạm bất kỳ đâu để vào. Không có nút. */
#ttg-boot{position:fixed;inset:0;z-index:2147483000;overflow:hidden;background:#161826;color:#e8fff4;font-family:'VT323',monospace;text-align:center;transition:opacity .6s ease;-webkit-tap-highlight-color:transparent}
#ttg-boot.out{opacity:0;pointer-events:none}
#ttg-boot .scene{position:absolute;inset:0}
#ttg-boot .pic{position:absolute;inset:0;background:#0b1020 url(img-boot-ngang.webp) 50% 50%/cover no-repeat}
#ttg-boot .shade{position:absolute;left:0;right:0;bottom:0;height:26%;background:linear-gradient(to top,rgba(4,10,14,.9) 0%,rgba(4,10,14,.55) 50%,rgba(4,10,14,0) 100%)}
#ttg-boot .panel{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:clamp(2px,.8vh,4px);
  padding:0 18px calc(max(2px,.8vh) + env(safe-area-inset-bottom,0px));box-sizing:border-box;opacity:0;transition:opacity .5s ease}
/* KHUNG THANH TIẾN TRÌNH: ảnh khung img-boot-frame.webp (1429x254, nền trong suốt) đè lên ô fill. --fw = bề ngang khung, đổi 1 chỗ này để to/nhỏ cả khung. */
#ttg-boot .frame{--fh:clamp(28px,10vh,44px);--fw:min(54vw,620px);position:relative;width:var(--fw);height:var(--fh);transition:filter .5s ease}
/* Khung 3 phần (border-image): 2 đầu rồng/phượng giữ nguyên tỉ lệ theo chiều cao --fh, đoạn giữa kéo dài theo --fw. Gốc 1429x254: đầu trái 430px, đầu phải 389px. */
#ttg-boot .frame .slot{position:absolute;left:calc(var(--fh)*179/254 - 2px);right:calc(var(--fh)*181/254 - 2px);top:calc(31.102% - 1px);height:calc(42.52% + 2px);overflow:hidden;background:linear-gradient(180deg,rgba(6,26,38,.78),rgba(10,50,62,.62))}
#ttg-boot .frame .slot i{position:absolute;left:0;top:0;bottom:0;width:0;overflow:hidden}
#ttg-boot .frame .slot canvas{position:absolute;left:0;top:0;height:100%}
#ttg-boot .frame .tip{position:absolute;top:-10%;bottom:-10%;left:0;width:6px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(255,255,255,.95),rgba(170,255,240,.5) 45%,rgba(170,255,240,0) 75%);filter:blur(1px);opacity:0;transition:opacity .4s}
#ttg-boot .frame .fr{position:absolute;inset:0;box-sizing:border-box;pointer-events:none;z-index:2;border-style:solid;border-width:0 calc(var(--fh)*389/254) 0 calc(var(--fh)*430/254);
  border-image:url(img-boot-frame.webp) 0 389 0 430 fill / 0 calc(var(--fh)*389/254) 0 calc(var(--fh)*430/254) stretch}
#ttg-boot #tb-pct{position:absolute;z-index:3;left:calc(var(--fh)*179/254);right:calc(var(--fh)*181/254);top:31.102%;height:42.52%;display:flex;align-items:center;justify-content:center;font-size:clamp(8px,2.8vh,12px);line-height:1;color:#fff;letter-spacing:.5px;
  text-shadow:0 0 3px #04141c,1px 1px 0 #04141c,-1px 1px 0 #04141c,1px -1px 0 #04141c,-1px -1px 0 #04141c}
#ttg-boot .enter{display:none;padding:clamp(1px,.5vh,3px) clamp(8px,1.8vw,14px);font-size:clamp(9px,min(2.8vh,1.7vw),14px);line-height:1.1;color:#ffe9a0;letter-spacing:.4px;white-space:nowrap;
  background:rgba(4,10,14,.55);border:1px solid rgba(242,199,106,.5);border-radius:3px;
  text-shadow:0 1px 0 #000,0 0 6px rgba(255,210,74,.7);animation:tb-blink 1.3s ease-in-out infinite;cursor:pointer}
/* HIỆU ỨNG NỀN: ảnh zoom chậm, sương trôi, quầng sáng logo, ánh trăng, sao + đom đóm (canvas) */
#ttg-boot .pic{animation:tb-in 1s ease both,tb-kb 28s ease-in-out 1s infinite alternate}
@keyframes tb-kb{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.08) translate3d(-1.2%,-1%,0)}}
#ttg-boot .mist{position:absolute;left:-30%;right:-30%;pointer-events:none;mix-blend-mode:screen;opacity:.5;will-change:transform}
#ttg-boot .mist.m1{top:52%;height:34%;background:radial-gradient(ellipse 40% 50% at 30% 50%,rgba(190,215,255,.34),rgba(190,215,255,0) 70%),radial-gradient(ellipse 35% 45% at 75% 55%,rgba(210,190,255,.28),rgba(210,190,255,0) 70%);animation:tb-mist 34s linear infinite alternate}
#ttg-boot .mist.m2{top:66%;height:30%;background:radial-gradient(ellipse 45% 50% at 60% 50%,rgba(170,235,230,.26),rgba(170,235,230,0) 70%),radial-gradient(ellipse 30% 40% at 20% 55%,rgba(255,230,190,.2),rgba(255,230,190,0) 70%);animation:tb-mist 46s linear infinite alternate-reverse}
@keyframes tb-mist{from{transform:translate3d(-8%,0,0)}to{transform:translate3d(8%,0,0)}}
#ttg-boot .glow{position:absolute;left:50%;top:22%;width:34vh;height:34vh;transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(255,226,150,.45),rgba(255,226,150,0) 65%);animation:tb-glow 4.5s ease-in-out infinite}
@keyframes tb-glow{0%,100%{opacity:.25;transform:translate(-50%,-50%) scale(.92)}50%{opacity:.8;transform:translate(-50%,-50%) scale(1.1)}}
#ttg-boot .moon{position:absolute;left:64.5%;top:15%;width:9vh;height:9vh;transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(220,235,255,.55),rgba(220,235,255,0) 70%);animation:tb-glow 6s ease-in-out infinite reverse}
#tb-fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ttg-boot.ready .enter{display:block}
#ttg-boot.ready .frame{filter:drop-shadow(0 0 7px rgba(120,255,220,.75))}
@keyframes tb-in{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
@keyframes tb-blink{0%,100%{opacity:1}50%{opacity:.35}}

<style>

#bgv,#bgv2{position:fixed;left:0;top:0;width:0;height:0;object-fit:fill;display:none;pointer-events:none;background:#000}#bgv2{opacity:0}/* nền VIDEO của khung trên: 2 thẻ video chồng nhau (A hiện, B chờ sẵn ở giây 0) để lặp không khựng; đứng TRƯỚC canvas trong HTML nên nằm sau canvas, không dùng z-index âm vì nền đen của body sẽ che; canvas được xóa trong suốt ở vùng khung trên thì video lộ ra */

.ub{position:absolute;left:0;top:0;transform-origin:0 0;touch-action:none;white-space:nowrap;box-sizing:border-box;height:18px;display:flex;align-items:center;padding:0 5px;font:bold 9px/1 sans-serif;color:#fff;background:#1c3a46;border:1px solid #8a6d2f;border-radius:3px;-webkit-tap-highlight-color:transparent}

</style></head><body>
<div id="ttg-boot" role="status" aria-live="polite">
  <div class="scene" id="tb-scene">
    <div class="pic"></div><div class="mist m1"></div><div class="mist m2"></div><div class="glow"></div><div class="moon"></div><canvas id="tb-fx"></canvas><div class="shade"></div>
    <div class="panel" id="tb-panel"><div class="enter" id="tb-enter">Chạm vào màn hình để vào Thú Thần Giới</div><div class="frame" id="tb-frame"><div class="slot" id="tb-slot"><i id="boot-fill"><canvas id="tb-wave"></canvas></i><div class="tip" id="tb-tip"></div></div><div class="fr"></div><span id="tb-pct">0%</span></div></div>
  </div>
</div>
<script>
/* Màn chờ game-moi. TTGBOOT.ready() (gọi khi ảnh thú đã nạp xong) -> thanh chạy tới 100% rồi chữ "Chạm vào màn hình để vào..." nổi giữa màn hình;
   chạm vào đâu cũng vào game. Quá 30 giây chưa xong cũng cho vào. Game chỉ chạy trong bản đã cài (app tự toàn màn hình + khóa ngang theo manifest), nên KHÔNG gọi requestFullscreen nữa. */
(function(){
  var el=document.getElementById('ttg-boot'),fill=document.getElementById('boot-fill'),pctEl=document.getElementById('tb-pct'),
    n=0,pct=0,floor=0,ready=false,done=false,shown=false,t0=Date.now(),start=t0,panel=document.getElementById('tb-panel');
  var tip=document.getElementById('tb-tip');
  function paint(){var p=Math.max(0,Math.min(100,pct));fill.style.width=p+'%';pctEl.textContent=Math.floor(p)+'%';tip.style.left=p+'%';tip.style.opacity=(p>0&&p<99.5)?1:0}
  var MIN=5000; /* thanh chạy theo thời gian: tối thiểu 5 giây mới tới 100% */
  var iv=setInterval(function(){
    var now=Date.now();
    panel.style.opacity=1;
    var base=Math.min(100,(now-start)/MIN*100);
    pct=ready?base:Math.min(base,90);
    paint();
    if(ready&&pct>=100&&!shown){shown=true;pct=100;paint();el.className='ready'}
  },50);
  document.addEventListener('DOMContentLoaded',function(){floor=Math.max(floor,35)});
  window.addEventListener('load',function(){floor=Math.max(floor,75)});
  function hide(){if(done||!el)return;done=true;clearInterval(iv);el.className='out';setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},700)}
  function setReady(){if(done)return;ready=true}
  document.getElementById('tb-scene').addEventListener('click',function(){if(shown)hide()});
  window.TTGBOOT={hide:hide,ready:setReady};
  setTimeout(setReady,30000);
})();

/* Hạt hiệu ứng màn chờ: sao nhấp nháy ở trời, đom đóm vàng/xanh bay lên, thỉnh thoảng có sao băng. Tự dừng khi màn chờ đóng. */
(function(){
  var cv=document.getElementById('tb-fx');if(!cv)return;var c=cv.getContext('2d'),W=0,H=0,D=1,P=[],S=[],sh=null,raf=0,last=0,nextSh=2500;
  function size(){D=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D}
  function spr(col){var s=document.createElement('canvas');s.width=s.height=32;var g=s.getContext('2d'),r=g.createRadialGradient(16,16,0,16,16,16);r.addColorStop(0,col+'1)');r.addColorStop(.25,col+'.6)');r.addColorStop(1,col+'0)');g.fillStyle=r;g.fillRect(0,0,32,32);return s}
  var SP=[spr('rgba(255,225,140,'),spr('rgba(140,255,225,'),spr('rgba(200,170,255,')];
  function init(){size();P=[];S=[];for(var i=0;i<34;i++)P.push({x:Math.random(),y:Math.random(),v:.012+Math.random()*.03,s:5+Math.random()*9,ph:Math.random()*6.28,k:Math.floor(Math.random()*3),a:.4+Math.random()*.6});
    for(i=0;i<46;i++)S.push({x:Math.random(),y:Math.random()*.42,r:.4+Math.random()*1.1,ph:Math.random()*6.28,sp:1+Math.random()*2.5})}
  function frame(t){
    if(!document.getElementById('ttg-boot')){return}
    raf=requestAnimationFrame(frame);var dt=Math.min(.05,(t-last)/1000||.016);last=t;var T=t/1000;
    c.setTransform(D,0,0,D,0,0);c.clearRect(0,0,W,H);c.globalCompositeOperation='lighter';
    for(var i=0;i<S.length;i++){var s=S[i],a=.35+.65*Math.abs(Math.sin(T*s.sp+s.ph));c.fillStyle='rgba(255,255,255,'+(a*.8)+')';c.beginPath();c.arc(s.x*W,s.y*H,s.r,0,6.283);c.fill()}
    for(i=0;i<P.length;i++){var p=P[i];p.y-=p.v*dt;if(p.y<-.05){p.y=1.05;p.x=Math.random()}
      var x=(p.x+Math.sin(T*.6+p.ph)*.015)*W,y=p.y*H,tw=.55+.45*Math.sin(T*2+p.ph),fade=Math.min(1,Math.min(p.y,1-p.y)*6);
      c.globalAlpha=Math.max(0,p.a*tw*fade);c.drawImage(SP[p.k],x-p.s,y-p.s,p.s*2,p.s*2)}
    c.globalAlpha=1;
    nextSh-=dt*1000;if(!sh&&nextSh<=0){sh={x:.2+Math.random()*.6,y:.03+Math.random()*.15,l:0};nextSh=5000+Math.random()*5000}
    if(sh){sh.l+=dt*1.6;var a2=Math.sin(Math.min(1,sh.l)*3.14),x0=sh.x*W+sh.l*W*.18,y0=sh.y*H+sh.l*H*.18;
      var g=c.createLinearGradient(x0,y0,x0-W*.09,y0-H*.09);g.addColorStop(0,'rgba(255,255,255,'+a2+')');g.addColorStop(1,'rgba(255,255,255,0)');
      c.strokeStyle=g;c.lineWidth=1.5;c.beginPath();c.moveTo(x0,y0);c.lineTo(x0-W*.09,y0-H*.09);c.stroke();if(sh.l>=1)sh=null}
    c.globalCompositeOperation='source-over'}
  init();window.addEventListener('resize',size);raf=requestAnimationFrame(frame);
})();

/* Thanh fill: sóng năng lượng xanh ngọc (canvas) chạy liên tục; vùng hiện ra do #boot-fill (width = % tiến trình) cắt lại. */
(function(){
  var cv=document.getElementById('tb-wave'),slot=document.getElementById('tb-slot');if(!cv||!slot)return;
  var c=cv.getContext('2d'),W=0,H=0,D=1,SP=[];
  function size(){D=Math.min(2,window.devicePixelRatio||1);W=slot.clientWidth;H=slot.clientHeight;cv.style.width=W+'px';cv.width=Math.max(1,Math.round(W*D));cv.height=Math.max(1,Math.round(H*D))}
  for(var i=0;i<22;i++)SP.push({x:Math.random(),y:Math.random(),v:.03+Math.random()*.08,r:.5+Math.random()*1.3,ph:Math.random()*6.28});
  function wv(t,amp,fr,sp,ph,yc,col,lw,al){
    c.beginPath();for(var x=0;x<=W;x+=2){var y=H*yc+Math.sin(x/W*fr*6.283+t*sp+ph)*H*amp+Math.sin(x/W*fr*2.1*6.283-t*sp*.7)*H*amp*.4;if(x)c.lineTo(x,y);else c.moveTo(x,y)}
    c.strokeStyle='rgba('+col+','+al+')';c.lineWidth=lw;c.shadowColor='rgba('+col+',.9)';c.shadowBlur=H*.35;c.stroke()}
  function frame(ts){
    if(!document.getElementById('ttg-boot'))return;requestAnimationFrame(frame);
    if(!W||!H){size();if(!W)return}
    var t=ts/1000;c.setTransform(D,0,0,D,0,0);c.clearRect(0,0,W,H);c.shadowBlur=0;
    var g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7ff5e4');g.addColorStop(.45,'#22c9c4');g.addColorStop(1,'#0b7f9a');c.fillStyle=g;c.fillRect(0,0,W,H);
    var h=c.createLinearGradient(0,0,W,0);h.addColorStop(0,'rgba(120,255,230,0)');h.addColorStop(.5,'rgba(200,170,255,.28)');h.addColorStop(1,'rgba(120,255,230,0)');
    c.save();c.translate(((t*.12)%1)*W*2-W,0);c.scale(1,1);c.fillStyle=h;c.fillRect(0,0,W,H);c.restore();
    c.globalCompositeOperation='lighter';
    wv(t,.22,1.6,2.2,0,.5,'255,255,255',Math.max(1.2,H*.11),.8);
    wv(t,.28,1.1,-1.7,1.7,.42,'205,175,255',Math.max(1,H*.09),.65);
    wv(t,.2,2.3,2.9,3.1,.6,'140,255,240',Math.max(1,H*.08),.6);
    c.shadowBlur=0;
    for(var i=0;i<SP.length;i++){var p=SP[i];p.x+=p.v*.016;if(p.x>1){p.x=0;p.y=Math.random()}
      c.fillStyle='rgba(255,255,255,'+(.35+.65*Math.abs(Math.sin(t*3+p.ph)))+')';c.beginPath();c.arc(p.x*W,p.y*H,p.r,0,6.283);c.fill()}
    c.globalCompositeOperation='source-over';
    var gl=c.createLinearGradient(0,0,0,H);gl.addColorStop(0,'rgba(255,255,255,.35)');gl.addColorStop(.4,'rgba(255,255,255,0)');gl.addColorStop(1,'rgba(0,30,50,.35)');c.fillStyle=gl;c.fillRect(0,0,W,H)}
  window.addEventListener('resize',size);requestAnimationFrame(frame);
})();

  pts=bgBoltSeg(0,0,(Math.random()-.5)*.16,L,5,L*.2),br=[],n=C.boltBranch,i,k,q,d,e,t,j;
 for(k=0;k<n;k++){i=Math.floor(pts.length*(.12+.62*Math.random()));q=pts[i];d=(k%2?-1:1)*(Math.random()<.8?1:-1);/* nhánh rẽ xen kẽ hai bên */
  e=bgBoltSeg(q[0],q[1],q[0]+d*(.04+Math.random()*.1),q[1]+L*(.18+Math.random()*.32),3,L*.075);br.push({i:i,pts:e});
  if(Math.random()<C.boltTwig){j=2+Math.floor(Math.random()*(e.length-4));t=e[j];/* nhánh con nhỏ, mũi nhọn */
   br.push({i:i+j,pts:bgBoltSeg(t[0],t[1],t[0]+d*(.02+Math.random()*.05),t[1]+L*(.07+Math.random()*.12),2,L*.04)});}}
 return {t0:T,bx:bx,by:by,pts:pts,br:br};}
/* vẽ đường gấp khúc (KHÔNG làm cong, giữ góc nhọn như tia sét thật); nét thon dần về cuối tia: wd = độ dày ở gốc, tp = mức thon (1 = nhọn hẳn), c = số đoạn mỗi khúc cùng độ dày */
function bgBoltPath(pts,n,ox,oy,s,wd,tp,c){var m=Math.min(n,pts.length),i,j,e,u;if(m<2)return;
 for(i=0;i<m-1;i+=c){e=Math.min(i+c,m-1);u=(i+c/2)/(m-1);ctx.lineWidth=Math.max(.3,wd*(1-tp*u));
  ctx.beginPath();ctx.moveTo(ox+pts[i][0]*s,oy+pts[i][1]*s);for(j=i+1;j<=e;j++)ctx.lineTo(ox+pts[j][0]*s,oy+pts[j][1]*s);ctx.stroke();}}
function bgDrawFx(ts,x,y,w,h){
 var o=bgImg,conf=bgConf,m=HD?K:1;
 if(!bgBase||bgKW!==w||bgKH!==h||bgKM!==m||bgKI!==o){bgKW=w;bgKH=h;bgKM=m;bgKI=o;bgFxBuild(o,conf,w,h,m);}
 ctx.drawImage(bgBase,x,y,w,h);
 if(document.hidden){bgLast=0;return;}/* tab ẩn: dừng hiệu ứng cho đỡ tốn pin */
 var dt=bgLast?Math.min(50,ts-bgLast):16;bgLast=ts;bgClock+=dt;
 var T=bgClock/1000,G=bgGeo,S=bgSpr,C=BG_FX_CFG,F=conf.fx||[],i,j,k,p,a,sz,sx,sy;
 ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.imageSmoothingEnabled=true;
 /* cực quang: 2 dải sáng mờ chồng lên ảnh, đổi độ sáng nhẹ lệch pha */
 if(F.indexOf('aurora')>=0){ctx.lineCap='round';
  for(i=0;i<2;i++){a=C.auroraOpacity*(.45+.55*Math.sin(T*C.auroraSpeed+i*2.3));
   var ax=x+G.ox+G.dw*.02,aw=G.dw*.96,ay=y+G.oy+G.dh*(i?.23:.08),amp=G.dh*(i?.022:.03);
   var ag=ctx.createLinearGradient(ax,0,ax+aw,0);ag.addColorStop(0,'rgba(110,255,220,0)');ag.addColorStop(.12,'rgba(110,255,225,.5)');ag.addColorStop(.5,'rgba(80,210,255,.72)');ag.addColorStop(.88,'rgba(110,255,225,.5)');ag.addColorStop(1,'rgba(110,255,220,0)');
   ctx.globalAlpha=a;ctx.strokeStyle=ag;ctx.lineWidth=G.dh*(i?.065:.085);ctx.beginPath();
   for(j=0;j<=24;j++){var q=j/24,px=ax+q*aw,py=ay+Math.sin(q*6.283+T*.35+i*2.1)*amp+Math.sin(q*3.1416-T*.22+i)*amp*.35;if(!j)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
   ctx.stroke();
  }ctx.lineCap='butt';}
 /* sương: 2 lớp trôi ngang lệch tốc độ, mỗi lớp 3 mảng, mờ dần ở hai đầu nên không bị giật khi quay vòng. Vùng có thể tự đặt độ cao (mistY) và độ đậm (mistOpacity). */
 if(F.indexOf('mist')>=0){var my=conf.mistY||[.68,.82],mo=conf.mistOpacity!=null?conf.mistOpacity:C.mistOpacity,ML=[[my[0],.55,1,.7],[my[1],.65,1.8,1]];
  for(i=0;i<2;i++){var L=ML[i],bw=w*.42,bh=G.dh*L[1]*.3;
   for(j=0;j<3;j++){var f=(T*C.mistSpeed*L[2]+j/3)%1;ctx.globalAlpha=mo*L[3]*Math.sin(f*Math.PI);
    ctx.drawImage(S.mist,x+(f*1.5-.25)*w-bw/2,y+G.oy+G.dh*L[0]-bh/2,bw,bh);}}}
 /* sao lấp lánh */
 if(F.indexOf('twinkle')>=0&&conf.stars){for(i=0;i<conf.stars.length;i++){p=conf.stars[i];sx=x+G.ox+p[0]*G.dw;sy=y+G.oy+p[1]*G.dh;
  if(sy<y||sy>y+h||sx<x||sx>x+w)continue;a=.5+.5*Math.sin(T*(1.3+i*.37)+i*1.9);sz=8+14*a;
  ctx.globalAlpha=C.starOpacity*(.3+.7*a);ctx.drawImage(S.star,sx-sz/2,sy-sz/2,sz,sz);}}
 /* tinh thể lóe sáng từng lúc */
 if(F.indexOf('sparkle')>=0&&conf.crystals){for(i=0;i<conf.crystals.length;i++){p=conf.crystals[i];sx=x+G.ox+p[0]*G.dw;sy=y+G.oy+p[1]*G.dh;
  if(sy<y||sy>y+h||sx<x||sx>x+w)continue;a=Math.pow(Math.max(0,Math.sin(T*1.1+i*2.3)),6);if(a<.05)continue;sz=4+6*a;
  ctx.globalAlpha=C.sparkleOpacity*a;ctx.drawImage(S.spark,sx-sz/2,sy-sz/2,sz,sz);}}
 /* hạt sáng/đom đóm: bay lơ lửng chậm, nhấp nháy, nằm ở nửa dưới khung (gần mặt đất) */
 if(F.indexOf('firefly')>=0){for(i=0;i<bgFly.length;i++){p=bgFly[i];p.x+=C.flySpeed*p.v*dt/1000;if(p.x>1.03)p.x=-.03;
  sx=x+w*p.x+Math.sin(T*.7*p.v+p.ph)*w*.012;sy=y+h*p.y+Math.sin(T*.5*p.v+p.ph*1.3)*h*.03;
  a=.5+.5*Math.sin(T*(1.2+p.v)+p.ph);sz=5+5*p.v;
  ctx.globalAlpha=C.flyOpacity*a*Math.min(1,Math.min(p.x+.03,1.03-p.x)*12);ctx.drawImage(S.fly,sx-sz/2,sy-sz/2,sz,sz);}}
 /* tuyết: 3 cỡ hạt (xa nhỏ/chậm, gần lớn/nhanh), trôi nhẹ sang phải */
 if(F.indexOf('snow')>=0){for(k=0;k<3;k++){var arr=bgSnow[k],sp=S.snow[k],d=sp.width/m;ctx.globalAlpha=C.snowOpacity*(.5+.2*k);
  for(j=0;j<arr.length;j++){p=arr[j];p.y+=C.snowSpeed*p.v*dt/1000;p.x+=(.006+.006*Math.sin(T*.6+p.ph))*p.v*dt/1000;
   if(p.y> C.snowArea){p.y=-.02;p.x=Math.random();}if(p.x>1.02)p.x=-.02;
   ctx.drawImage(sp,x+w*p.x-d/2,y+h*p.y-d/2,d,d);}}}
 /* ===== Hiệu ứng chép từ scPt (04-scenes.js), quy theo cỡ khung ===== */
 var u=w/360,v=h/270,R=function(n){var r=Math.sin(n*127.1+311.7)*43758.5453;return r-Math.floor(r);},rgb;
 /* vệt gió: các vạch ngang mảnh chạy từ trái sang phải */
 if(F.indexOf('streak')>=0){rgb=conf.streakRgb||'235,248,255';ctx.strokeStyle='rgba('+rgb+','+C.streakOpacity+')';ctx.lineWidth=1;ctx.globalAlpha=1;
  for(i=0;i<C.streakCount;i++){sx=(T*110*C.streakSpeed*(1+i%3*.5)+i*67)%(360+80)-40;sy=14+i*(236/C.streakCount);
   ctx.beginPath();ctx.moveTo(x+sx*u,y+sy*v);ctx.lineTo(x+(sx+22+i%3*10)*u,y+sy*v);ctx.stroke();}}
 /* lá bay: mảnh nhỏ xoay, trôi chéo xuống */
 if(F.indexOf('leaf')>=0){ctx.fillStyle='rgba('+(conf.leafRgb||'150,215,110')+','+C.leafOpacity+')';ctx.globalAlpha=1;
  for(i=0;i<C.leafCount;i++){sx=(i*47+T*9*C.leafSpeed+Math.sin(T*.8+i)*16)%360;sy=(T*(13+i%3*5)*C.leafSpeed+i*31)%270;
   ctx.save();ctx.translate(x+sx*u,y+sy*v);ctx.rotate(T+i);ctx.fillRect(-3,-1,6,2);ctx.restore();}}
 /* tia điện: chớp nhanh từng điểm nhỏ ở nửa trên (chỗ sét) */
 if(F.indexOf('spark')>=0){ctx.fillStyle='rgba('+(conf.sparkRgb||'255,230,150')+','+C.sparkOpacity+')';ctx.globalAlpha=1;
  for(i=0;i<C.sparkCount;i++){if(Math.sin(T*C.sparkSpeed+i*3)>.6)ctx.fillRect(x+R(i)*w,y+R(i+7)*h*.6,2,2+i%3);}}
 /* sao lấp lánh: chấm nhỏ, chỉ ở nửa trên ảnh */
 if(F.indexOf('star')>=0){ctx.fillStyle='#fff';
  for(i=0;i<C.starCount;i++){ctx.globalAlpha=C.starTwinkle*(.2+.7*Math.abs(Math.sin(T*1.3+i)));
   ctx.fillRect(Math.round(x+R(i)*w),Math.round(y+G.oy+R(i+3)*G.dh*C.starArea),i%5?1:2,i%5?1:2);}}
 /* ánh lóe chữ thập: theo tọa độ crystals nếu vùng có, không thì rải ngẫu nhiên */
 if(F.indexOf('glint')>=0){ctx.fillStyle='rgba('+(conf.glintRgb||'255,255,255')+',1)';
  for(i=0;i<C.glintCount;i++){a=Math.sin(T*2+i*1.7);if(a<.1)continue;
   if(conf.crystals){p=conf.crystals[i%conf.crystals.length];sx=x+G.ox+p[0]*G.dw;sy=y+G.oy+p[1]*G.dh;if(sx<x||sx>x+w)continue;}
   else{sx=x+R(i+20)*w;sy=y+h*(.26+R(i+40)*.6);}
   ctx.globalAlpha=C.glintOpacity*a;ctx.fillRect(sx-3,sy,7,1);ctx.fillRect(sx,sy-3,1,7);}}

 /* tia sét: đánh từ trên xuống (mọc dần ~0,1s), chớp 2 nhịp rồi tắt; có nhánh rẽ, vầng sáng neon vàng (boltGlow/boltMid/boltCore = 'r,g,b' riêng từng vùng) + lõi trắng vàng, bầu trời sáng lên theo nhịp chớp */
 if(F.indexOf('bolt')>=0&&conf.boltX){
  if(T>=bgBoltNext&&bgBolts.length<C.boltMax){bgBolts.push(bgBoltNew(conf,T));bgBoltNext=T+C.boltEvery[0]+Math.random()*(C.boltEvery[1]-C.boltEvery[0]);}
  for(i=bgBolts.length-1;i>=0;i--){var B=bgBolts[i],f=(T-B.t0)/C.boltLife;if(f>=1){bgBolts.splice(i,1);continue;}
   var grow=Math.min(1,f/.12),I=(f<.12?f/.12:Math.pow(1-(f-.12)/.88,1.6))*(.7+.3*Math.abs(Math.sin(f*31)))+.5*Math.exp(-Math.pow((f-.32)/.05,2));
   I=Math.min(1,I)*C.boltOpacity;if(I<.02)continue;
   var ox=x+G.ox+B.bx*G.dw,oy=y+G.oy+B.by*G.dh,s=G.dh,sc=G.dh/330*C.boltWidth,nM=Math.max(2,Math.ceil(B.pts.length*grow)),b,bn;
   if(C.boltFlash>0){var fg=ctx.createLinearGradient(0,y,0,y+h*.65);var fr=conf.boltFlashRgb||'255,200,90';fg.addColorStop(0,'rgba('+fr+','+(C.boltFlash*I)+')');fg.addColorStop(1,'rgba('+fr+',0)');
    ctx.globalCompositeOperation='lighter';ctx.globalAlpha=1;ctx.fillStyle=fg;ctx.fillRect(x,y,w,h*.65);}
   ctx.lineCap='round';ctx.lineJoin='round';
   var bg1=conf.boltGlow||'255,160,20',bg2=conf.boltMid||'255,214,60',bg3=conf.boltCore||'255,252,225';/* 3 lớp: vầng sáng mờ, viền vàng mảnh, lõi trắng rất mảnh */
   var PS=[[7,'rgba('+bg1+','+(.16*I)+')','lighter'],[2.6,'rgba('+bg2+','+(.7*I)+')','lighter'],[1.1,'rgba('+bg3+','+I+')','source-over']];
   ctx.lineCap='round';ctx.lineJoin='miter';ctx.miterLimit=3;
   for(var ps=0;ps<3;ps++){ctx.globalCompositeOperation=PS[ps][2];ctx.strokeStyle=PS[ps][1];ctx.globalAlpha=1;
    bgBoltPath(B.pts,nM,ox,oy,s,PS[ps][0]*sc,.92,4);
    for(b=0;b<B.br.length;b++){if(B.br[b].i>=nM)continue;bn=Math.min(1,(nM-B.br[b].i)/6);bgBoltPath(B.br[b].pts,Math.max(2,Math.ceil(B.br[b].pts.length*bn)),ox,oy,s,PS[ps][0]*sc*.6,.96,2);}}
   ctx.globalCompositeOperation='source-over';ctx.lineCap='butt';
  }}
 ctx.restore();
}
document.addEventListener('visibilitychange',function(){bgLast=0;if(document.hidden){BGV.pause();BGV2.pause();if(bgRaf){cancelAnimationFrame(bgRaf);bgRaf=0;}if(mainRaf){cancelAnimationFrame(mainRaf);mainRaf=0;}}else{if(bgOn){try{bgCur.play();}catch(e){}if(!bgRaf)bgRaf=requestAnimationFrame(function(){bgTick(bgGen);});}if(!mainRaf)mainRaf=requestAnimationFrame(loop);}});
/* SẢNH CHÍNH: chỉ 1 thú đứng 1 mình ở GIỮA khung (tâm = giữa mép trái và mép phải khung). Thanh trên, thông tin, nút... làm sau. */
function petSanh(ts){var x=Math.round(I.l+(W-I.l-I.r)/2),bob=Math.round(Math.sin(ts/380)*2);
 dp(ID,bm,x,gy()+bob);}
function draw(ts){bgSync();
 var th=TH(),fx=I.l,fw=W-I.l-I.r,pt=th+GAPB;
 ctx.fillStyle='#0b1020';ctx.fillRect(0,0,W,H);
 /* nền khung trên: trời + đất (sau này mỗi vùng đổi nền ở đây) */
  if(bgOn||bgImageOn){ctx.clearRect(fx,0,fw,th);if(bgImageOn){var be2=bgInset(th),bl=be2.l,br=be2.r,bt=be2.t,bb=be2.b;bgDrawFx(ts,fx+bl,bt,fw-bl-br,th-bt-bb);}}else{
 var g=ctx.createLinearGradient(0,0,0,gy());g.addColorStop(0,'#9fc4ee');g.addColorStop(1,'#dfeefb');ctx.fillStyle=g;ctx.fillRect(fx,0,fw,gy());
 ctx.fillStyle='#e8f1fa';ctx.fillRect(fx,gy(),fw,th-gy());if(SCENE!=='sanh'){ctx.fillStyle='#c4d6ea';ctx.fillRect(fx,gy(),fw,2);}}
 /* nền khung dưới (chứa nút) */
 var pg=ctx.createLinearGradient(0,pt,0,pt+BP);pg.addColorStop(0,'#151a3a');pg.addColorStop(1,'#0c1026');ctx.fillStyle=pg;ctx.fillRect(fx,pt,fw,BP);
 /* khung (đã dựng sẵn ở độ phân giải máy) */
 if(FL){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(FL,0,0);ctx.restore();}
 if(SCENE==='sanh'){petSanh(ts);return;}
 pet('en',ts);pet('me',ts);
 var ox=140,bw=Math.min(220,Math.floor((W-2*ox-40)/2)),nm=THU_MOI.byId[ID].ten,by=I.t+32;
 bar(I.l+ox,by,bw,st.me/100,'#3c3',nm+' (bạn)');bar(W-I.r-ox-bw,by,bw,st.en/100,'#c33',nm+' (địch)');
 ctx.textAlign='center';ctx.textBaseline='top';ctx.font='10px sans-serif';ctx.fillStyle='#123';ctx.fillText((HD?'HD 192→128':'thú 128px')+' · x'+K+' · '+W+'×'+H+' · v5',W/2,I.t+50);
 st.fx=st.fx.filter(function(f){return ts-f.t<900;});
 st.fx.forEach(function(f){ctx.fillStyle='#d11';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(f.s,f.x,f.y-Math.round((ts-f.t)/20));});
 if(st.msg){ctx.fillStyle='#123';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(st.msg,W/2,Math.max(I.t+70,gy()-170));}}
function loop(ts){mainRaf=0;if(document.hidden)return;if(SCENE==='tran')autoTick();draw(ts);mainRaf=requestAnimationFrame(loop);}

reset();resize();if(!document.hidden)mainRaf=requestAnimationFrame(loop);
