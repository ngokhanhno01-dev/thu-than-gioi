(function(){
  function mm(q){try{return matchMedia(q).matches}catch(e){return false}}
  var app=mm('(display-mode: fullscreen)')||mm('(display-mode: standalone)')||mm('(display-mode: minimal-ui)')||mm('(display-mode: window-controls-overlay)')||navigator.standalone===true;
  window.TTG_APP=app;
  if(!app){
    window.TTG_BLOCK=true;
    document.documentElement.style.visibility='hidden';
    try{location.replace(new URL('trang-chu/?can-cai=1',document.baseURI).href)}catch(e){location.href='../trang-chu/?can-cai=1'}
  }
})();

<style id="boot-css">
/* MÀN CHỜ (game chỉ có màn ngang): ảnh nền phủ toàn màn hình, thanh tiến trình ở đáy;
   tải xong thì chữ "Chạm vào màn hình để vào Thú Thần Giới" nổi giữa màn hình, chạm bất kỳ đâu để vào. Không có nút. */
#ttg-boot{position:fixed;inset:0;z-index:2147483000;overflow:hidden;background:#161826;color:#e8fff4;font-family:'VT323',monospace;text-align:center;transition:opacity .6s ease;-webkit-tap-highlight-color:transparent}
#ttg-boot.out{opacity:0;pointer-events:none}
#ttg-boot .scene{position:absolute;inset:0}
#ttg-boot .pic{position:absolute;inset:0;background:#0b1020 url(img-boot-ngang.webp) 50% 50%/cover no-repeat}
#ttg-boot .shade{position:absolute;left:0;right:0;bottom:0;height:26%;background:linear-gradient(to top,rgba(4,10,14,.9) 0%,rgba(4,10,14,.55) 50%,rgba(4,10,14,0) 100%)}
#ttg-boot .panel{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:clamp(2px,.8vh,4px);
  padding:0 18px calc(max(2px,.8vh) + env(safe-area-inset-bottom,0px));box-sizing:border-box;opacity:0;transition:opacity .5s ease}
/* KHUNG THANH TIẾN TRÌNH: ảnh khung img-boot-frame.webp (1429x254, nền trong suốt) đè lên ô fill. --fw = bề ngang khung, đổi 1 chỗ này để to/nhỏ cả khung. */
#ttg-boot .frame{--fh:clamp(28px,10vh,44px);--fw:min(54vw,620px);position:relative;width:var(--fw);height:var(--fh);transition:filter .5s ease}
/* Khung 3 phần (border-image): 2 đầu rồng/phượng giữ nguyên tỉ lệ theo chiều cao --fh, đoạn giữa kéo dài theo --fw. Gốc 1429x254: đầu trái 430px, đầu phải 389px. */
#ttg-boot .frame .slot{position:absolute;left:calc(var(--fh)*179/254 - 2px);right:calc(var(--fh)*181/254 - 2px);top:calc(31.102% - 1px);height:calc(42.52% + 2px);overflow:hidden;background:linear-gradient(180deg,rgba(6,26,38,.78),rgba(10,50,62,.62))}
#ttg-boot .frame .slot i{position:absolute;left:0;top:0;bottom:0;width:0;overflow:hidden}
#ttg-boot .frame .slot canvas{position:absolute;left:0;top:0;height:100%}
#ttg-boot .frame .tip{position:absolute;top:-10%;bottom:-10%;left:0;width:6px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(255,255,255,.95),rgba(170,255,240,.5) 45%,rgba(170,255,240,0) 75%);filter:blur(1px);opacity:0;transition:opacity .4s}
#ttg-boot .frame .fr{position:absolute;inset:0;box-sizing:border-box;pointer-events:none;z-index:2;border-style:solid;border-width:0 calc(var(--fh)*389/254) 0 calc(var(--fh)*430/254);
  border-image:url(img-boot-frame.webp) 0 389 0 430 fill / 0 calc(var(--fh)*389/254) 0 calc(var(--fh)*430/254) stretch}
#ttg-boot #tb-pct{position:absolute;z-index:3;left:calc(var(--fh)*179/254);right:calc(var(--fh)*181/254);top:31.102%;height:42.52%;display:flex;align-items:center;justify-content:center;font-size:clamp(8px,2.8vh,12px);line-height:1;color:#fff;letter-spacing:.5px;
  text-shadow:0 0 3px #04141c,1px 1px 0 #04141c,-1px 1px 0 #04141c,1px -1px 0 #04141c,-1px -1px 0 #04141c}
#ttg-boot .enter{display:none;padding:clamp(1px,.5vh,3px) clamp(8px,1.8vw,14px);font-size:clamp(9px,min(2.8vh,1.7vw),14px);line-height:1.1;color:#ffe9a0;letter-spacing:.4px;white-space:nowrap;
  background:rgba(4,10,14,.55);border:1px solid rgba(242,199,106,.5);border-radius:3px;
  text-shadow:0 1px 0 #000,0 0 6px rgba(255,210,74,.7);animation:tb-blink 1.3s ease-in-out infinite;cursor:pointer}
/* HIỆU ỨNG NỀN: ảnh zoom chậm, sương trôi, quầng sáng logo, ánh trăng, sao + đom đóm (canvas) */
#ttg-boot .pic{animation:tb-in 1s ease both,tb-kb 28s ease-in-out 1s infinite alternate}
@keyframes tb-kb{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.08) translate3d(-1.2%,-1%,0)}}

#ttg-boot .mist.m1{top:52%;height:34%;background:radial-gradient(ellipse 40% 50% at 30% 50%,rgba(190,215,255,.34),rgba(190,215,255,0) 70%),radial-gradient(ellipse 35% 45% at 75% 55%,rgba(210,190,255,.28),rgba(210,190,255,0) 70%);animation:tb-mist 34s linear infinite alternate}
#ttg-boot .mist.m2{top:66%;height:30%;background:radial-gradient(ellipse 45% 50% at 60% 50%,rgba(170,235,230,.26),rgba(170,235,230,0) 70%),radial-gradient(ellipse 30% 40% at 20% 55%,rgba(255,230,190,.2),rgba(255,230,190,0) 70%);animation:tb-mist 46s linear infinite alternate-reverse}
@keyframes tb-mist{from{transform:translate3d(-8%,0,0)}to{transform:translate3d(8%,0,0)}}
#ttg-boot .glow{position:absolute;left:50%;top:22%;width:34vh;height:34vh;transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:screen;

@keyframes tb-glow{0%,100%{opacity:.25;transform:translate(-50%,-50%) scale(.92)}50%{opacity:.8;transform:translate(-50%,-50%) scale(1.1)}}

<div id="ttg-boot" role="status" aria-live="polite">
  <div class="scene" id="tb-scene">
    <div class="pic"></div><div class="mist m1"></div><div class="mist m2"></div><div class="glow"></div><div class="moon"></div><canvas id="tb-fx"></canvas><div class="shade"></div>
    <div class="panel" id="tb-panel"><div class="enter" id="tb-enter">Chạm vào màn hình để vào Thú Thần Giới</div><div class="frame" id="tb-frame"><div class="slot" id="tb-slot"><i id="boot-fill"><canvas id="tb-wave"></canvas></i><div class="tip" id="tb-tip"></div></div><div class="fr"></div><span id="tb-pct">0%</span></div></div>
  </div>
</div>
<script>
/* Màn chờ game-moi. TTGBOOT.ready() (gọi khi ảnh thú đã nạp xong) -> thanh chạy tới 100% rồi chữ "Chạm vào màn hình để vào..." nổi giữa màn hình;
   chạm vào đâu cũng vào game. Quá 30 giây chưa xong cũng cho vào. Game chỉ chạy trong bản đã cài (app tự toàn màn hình + khóa ngang theo manifest), nên KHÔNG gọi requestFullscreen nữa. */
(function(){
  var el=document.getElementById('ttg-boot'),fill=document.getElementById('boot-fill'),pctEl=document.getElementById('tb-pct'),
    n=0,pct=0,floor=0,ready=false,done=false,shown=false,t0=Date.now(),start=t0,panel=document.getElementById('tb-panel');
  var tip=document.getElementById('tb-tip');
  function paint(){var p=Math.max(0,Math.min(100,pct));fill.style.width=p+'%';pctEl.textContent=Math.floor(p)+'%';tip.style.left=p+'%';tip.style.opacity=(p>0&&p<99.5)?1:0}
  var MIN=5000; /* thanh chạy theo thời gian: tối thiểu 5 giây mới tới 100% */
  var iv=setInterval(function(){
    var now=Date.now();
    panel.style.opacity=1;
    var base=Math.min(100,(now-start)/MIN*100);
    pct=ready?base:Math.min(base,90);
    paint();
    if(ready&&pct>=100&&!shown){shown=true;pct=100;paint();el.className='ready'}
  },50);
  document.addEventListener('DOMContentLoaded',function(){floor=Math.max(floor,35)});
  window.addEventListener('load',function(){floor=Math.max(floor,75)});
  function hide(){if(done||!el)return;done=true;clearInterval(iv);el.className='out';setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},700)}
  function setReady(){if(done)return;ready=true}
  document.getElementById('tb-scene').addEventListener('click',function(){if(shown)hide()});
  window.TTGBOOT={hide:hide,ready:setReady};
  setTimeout(setReady,30000);
})();

/* Hạt hiệu ứng màn chờ: sao nhấp nháy ở trời, đom đóm vàng/xanh bay lên, thỉnh thoảng có sao băng. Tự dừng khi màn chờ đóng. */
(function(){
  var cv=document.getElementById('tb-fx');if(!cv)return;var c=cv.getContext('2d'),W=0,H=0,D=1,P=[],S=[],sh=null,raf=0,last=0,nextSh=2500;
  function size(){D=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D}
  function spr(col){var s=document.createElement('canvas');s.width=s.height=32;var g=s.getContext('2d'),r=g.createRadialGradient(16,16,0,16,16,16);r.addColorStop(0,col+'1)');r.addColorStop(.25,col+'.6)');r.addColorStop(1,col+'0)');g.fillStyle=r;g.fillRect(0,0,32,32);return s}
  var SP=[spr('rgba(255,225,140,'),spr('rgba(140,255,225,'),spr('rgba(200,170,255,')];
  function init(){size();P=[];S=[];for(var i=0;i<34;i++)P.push({x:Math.random(),y:Math.random(),v:.012+Math.random()*.03,s:5+Math.random()*9,ph:Math.random()*6.28,k:Math.floor(Math.random()*3),a:.4+Math.random()*.6});
    for(i=0;i<46;i++)S.push({x:Math.random(),y:Math.random()*.42,r:.4+Math.random()*1.1,ph:Math.random()*6.28,sp:1+Math.random()*2.5})}
  function frame(t){
    if(!document.getElementById('ttg-boot')){return}
    raf=requestAnimationFrame(frame);var dt=Math.min(.05,(t-last)/1000||.016);last=t;var T=t/1000;
    c.setTransform(D,0,0,D,0,0);c.clearRect(0,0,W,H);c.globalCompositeOperation='lighter';
    for(var i=0;i<S.length;i++){var s=S[i],a=.35+.65*Math.abs(Math.sin(T*s.sp+s.ph));c.fillStyle='rgba(255,255,255,'+(a*.8)+')';c.beginPath();c.arc(s.x*W,s.y*H,s.r,0,6.283);c.fill()}
    for(i=0;i<P.length;i++){var p=P[i];p.y-=p.v*dt;if(p.y<-.05){p.y=1.05;p.x=Math.random()}
      var x=(p.x+Math.sin(T*.6+p.ph)*.015)*W,y=p.y*H,tw=.55+.45*Math.sin(T*2+p.ph),fade=Math.min(1,Math.min(p.y,1-p.y)*6);
      c.globalAlpha=Math.max(0,p.a*tw*fade);c.drawImage(SP[p.k],x-p.s,y-p.s,p.s*2,p.s*2)}
    c.globalAlpha=1;
    nextSh-=dt*1000;if(!sh&&nextSh<=0){sh={x:.2+Math.random()*.6,y:.03+Math.random()*.15,l:0};nextSh=5000+Math.random()*5000}
    if(sh){sh.l+=dt*1.6;var a2=Math.sin(Math.min(1,sh.l)*3.14),x0=sh.x*W+sh.l*W*.18,y0=sh.y*H+sh.l*H*.18;
      var g=c.createLinearGradient(x0,y0,x0-W*.09,y0-H*.09);g.addColorStop(0,'rgba(255,255,255,'+a2+')');g.addColorStop(1,'rgba(255,255,255,0)');
      c.strokeStyle=g;c.lineWidth=1.5;c.beginPath();c.moveTo(x0,y0);c.lineTo(x0-W*.09,y0-H*.09);c.stroke();if(sh.l>=1)sh=null}
    c.globalCompositeOperation='source-over'}
  init();window.addEventListener('resize',size);raf=requestAnimationFrame(frame);
})();

/* Thanh fill: sóng năng lượng xanh ngọc (canvas) chạy liên tục; vùng hiện ra do #boot-fill (width = % tiến trình) cắt lại. */
(function(){
  var cv=document.getElementById('tb-wave'),slot=document.getElementById('tb-slot');if(!cv||!slot)return;
  var c=cv.getContext('2d'),W=0,H=0,D=1,SP=[];
  function size(){D=Math.min(2,window.devicePixelRatio||1);W=slot.clientWidth;H=slot.clientHeight;cv.style.width=W+'px';cv.width=Math.max(1,Math.round(W*D));cv.height=Math.max(1,Math.round(H*D))}
  for(var i=0;i<22;i++)SP.push({x:Math.random(),y:Math.random(),v:.03+Math.random()*.08,r:.5+Math.random()*1.3,ph:Math.random()*6.28});
  function wv(t,amp,fr,sp,ph,yc,col,lw,al){
    c.beginPath();for(var x=0;x<=W;x+=2){var y=H*yc+Math.sin(x/W*fr*6.283+t*sp+ph)*H*amp+Math.sin(x/W*fr*2.1*6.283-t*sp*.7)*H*amp*.4;if(x)c.lineTo(x,y);else c.moveTo(x,y)}
    c.strokeStyle='rgba('+col+','+al+')';c.lineWidth=lw;c.shadowColor='rgba('+col+',.9)';c.shadowBlur=H*.35;c.stroke()}
  function frame(ts){
    if(!document.getElementById('ttg-boot'))return;requestAnimationFrame(frame);
    if(!W||!H){size();if(!W)return}
    var t=ts/1000;c.setTransform(D,0,0,D,0,0);c.clearRect(0,0,W,H);c.shadowBlur=0;
    var g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7ff5e4');g.addColorStop(.45,'#22c9c4');g.addColorStop(1,'#0b7f9a');c.fillStyle=g;c.fillRect(0,0,W,H);
    var h=c.createLinearGradient(0,0,W,0);h.addColorStop(0,'rgba(120,255,230,0)');h.addColorStop(.5,'rgba(200,170,255,.28)');h.addColorStop(1,'rgba(120,255,230,0)');
    c.save();c.translate(((t*.12)%1)*W*2-W,0);c.scale(1,1);c.fillStyle=h;c.fillRect(0,0,W,H);c.restore();
    c.globalCompositeOperation='lighter';
    wv(t,.22,1.6,2.2,0,.5,'255,255,255',Math.max(1.2,H*.11),.8);
    wv(t,.28,1.1,-1.7,1.7,.42,'205,175,255',Math.max(1,H*.09),.65);
    wv(t,.2,2.3,2.9,3.1,.6,'140,255,240',Math.max(1,H*.08),.6);
    c.shadowBlur=0;
