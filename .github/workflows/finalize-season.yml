# Chốt mùa Đấu Trường — Thú Thần Giới Online
# Chạy tự động ngay sau 00:00 thứ Hai giờ Việt Nam (= 17:00 Chủ Nhật giờ UTC), có vài lần chạy dự phòng vì GitHub hay trễ.
# Script có tính IDEMPOTENT (chạy bao nhiêu lần cũng không phát thưởng đôi) nên chạy dự phòng là an toàn.
name: Chot mua dau truong

on:
  schedule:
    - cron: '10 17 * * 0'   # 00:10 thứ Hai (VN)
    - cron: '40 18 * * 0'   # 01:40 thứ Hai (VN) - dự phòng
    - cron: '10 21 * * 0'   # 04:10 thứ Hai (VN) - dự phòng
    - cron: '10 3 * * 1'    # 10:10 thứ Hai (VN) - dự phòng cuối
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Chạy thử (chỉ in kết quả, KHÔNG ghi gì)'
        type: boolean
        default: true
      season:
        description: 'Số mùa cần chốt (bỏ trống = tự tìm mùa đã kết thúc mà chưa chốt)'
        type: string
        required: false
      approve:
        description: 'uid người bị giữ lại mà bạn DUYỆT (cách nhau dấu phẩy, bỏ trống nếu không có)'
        type: string
        required: false

permissions:
  contents: read
  actions: write    # chỉ để bước "giữ workflow sống" bên dưới

concurrency:
  group: finalize-season
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cai thu vien
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: Chot mua
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          # Lịch tự động: chạy THẬT. Chạy tay: theo ô "dry_run" (mặc định là chạy thử).
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          SEASON_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.season || '' }}
          APPROVE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.approve || '' }}
        run: node finalize-season.js

      # GitHub tự TẮT workflow theo lịch nếu repo không có hoạt động 60 ngày.
      # Bước này gọi lại lệnh "bật workflow" mỗi lần chạy. Chưa kiểm chứng là có reset được bộ đếm 60 ngày
      # hay không; nếu thấy workflow bị tắt ở tab Actions thì bấm "Enable workflow" (xem HUONG-DAN-BUOC-6.md).
      - name: Giu workflow song
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/finalize-season.yml/enable"
