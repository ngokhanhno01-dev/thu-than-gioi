<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../">
<title>FX Demo — Thú Thần Giới</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:8px;background:#120c1a;color:#f3e9ff;font:14px/1.4 system-ui,sans-serif;text-align:center}
h1{font-size:16px;margin:4px 0 8px}
canvas{display:block;margin:0 auto;border:1px solid #3a2a55;border-radius:8px;background:#000;touch-action:manipulation}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:8px auto;max-width:720px}
select,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #5a3f86;background:#2a1d40;color:#fff;min-height:44px}
button{background:#6a3fc4;font-weight:700}
label{display:flex;align-items:center;gap:6px}
#info{font-size:12px;color:#b9a7d6;min-height:34px;white-space:pre-wrap}
</style></head><body>
<h1>Trang xem thử hiệu ứng (vẽ bằng code)</h1>
<canvas id="cv"></canvas>
<div class="row"><select id="zone"></select><select id="side"><option value="p">Thú đánh quái</option><option value="m">Quái đánh thú</option></select></div>
<div class="row"><select id="style"><option value="px">Kiểu: Pixel</option><option value="sm">Kiểu: Mịn</option></select><select id="spd"><option value="1">Tốc độ 1x</option><option value="0.5">Chậm 0.5x</option><option value="0.25">Rất chậm 0.25x</option></select></div>
<div class="row"><button id="play">▶ Phát lại</button><label><input type="checkbox" id="loop" checked> Lặp</label></div>
<div id="info"></div>
<script src="31-combat-fx.js"></script>
<script src="33-attack-fx.js"></script>
<script>
'use strict';
const FX=window.TTGCombatFX,CW=360,CH=230,GY=204,PS=2;
const cv=document.getElementById('cv'),g=cv.getContext('2d'),info=document.getElementById('info');
const $=id=>document.getElementById(id);
const pxc=document.createElement('canvas'),pg=pxc.getContext('2d');pxc.width=CW/PS;pxc.height=CH/PS;
function fit(){const w=Math.min(innerWidth-16,720),d=Math.min(window.devicePixelRatio||1,3);cv.style.width=w+'px';cv.style.height=(w*CH/CW)+'px';cv.width=Math.round(w*d);cv.height=Math.round(w*d*CH/CW)}
fit();addEventListener('resize',fit);
if(!FX){info.textContent='Không tải được 31-combat-fx.js'}
else{
 const sel=$('zone');
 sel.innerHTML='<option value="E">❄ Tuyết Nguyên (bản thử bằng code)</option>'+FX.zones.map((z,i)=>'<option value="'+i+'">'+i+' · '+z.name+' ('+(z.mode==='melee'?'gần':'xa')+') — cũ dùng ảnh</option>').join('');
}
/* ---- thú giả để có chỗ đánh ---- */
function pet(g,x,c1,c2,T,flip){
 const b=Math.sin(T*3+x)*1.5;
 g.save();g.translate(x,0);if(flip)g.scale(-1,1);
 g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(0,GY,26,6,0,0,6.283);g.fill();
 const gr=g.createLinearGradient(0,GY-62,0,GY);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;
 g.beginPath();g.ellipse(0,GY-30+b,24,30,0,0,6.283);g.fill();
 g.fillStyle='#fff';g.beginPath();g.arc(8,GY-40+b,6,0,6.283);g.arc(-4,GY-40+b,6,0,6.283);g.fill();
 g.fillStyle='#111';g.beginPath();g.arc(10,GY-40+b,3,0,6.283);g.arc(-2,GY-40+b,3,0,6.283);g.fill();
 g.restore();
}
/* ---- TUYẾT NGUYÊN (bản thử): không có vật bay. Dải băng mọc từ đất, chạy từ chân người đánh tới mục tiêu, thấp → cao,
   cụm gai lớn nhất bao quanh mục tiêu (chừa khoảng giữa để thấy mục tiêu). Rồi vỡ dần từ mục tiêu ngược về người đánh. ---- */
const TH=.63,TS=.12,TSH=.9,TOTAL_E=2.9;     /* TH = lúc "trúng" (gai lớn nhất mọc), TS = bắt đầu mọc, TSH = bắt đầu vỡ */
const ET={
 run(g,T,t,pa){
  const E=FX.engine,s=E.seed('fx',t),r=E.rng(s.seed),dir=pa?1:-1,x0=pa?108:250,tx=pa?272:85,L=Math.abs(tx-x0),col='#9fe4ff',
   pal={dark:'#1b5fa8',mid:'#58b8f0',light:'#c8f2ff',edge:'#e8fbff'},pal2={dark:'#27408f',mid:'#6f94e8',light:'#d4e4ff',edge:'#ffffff'};
  const main=[],back=[],small=[];
  for(let i=0;i<13;i++){const k=i/12;main.push({k,x:x0+dir*(k*(L-40))+r.range(-4,4),y:GY,h:14+90*Math.pow(k,1.6)+r.range(0,10),w:9+11*k+r.range(0,3),lean:r.range(-4,4)+dir*2,tE:TS+k*(TH-TS-.1),p:pal})}
  [[-34,125,26,0,-1],[34,118,24,.04,1],[-54,86,16,.07,-1],[54,80,16,.1,1]].forEach(c=>
   main.push({k:1,x:tx+dir*c[0],y:GY,h:c[1],w:c[2],lean:c[4]*dir*6,tE:TH-.1+c[3],p:pal,hi:1}));
  for(let i=0;i<12;i++){const k=i/11;back.push({k,x:x0+dir*(k*L)+r.range(-6,6),y:GY-5,h:10+.55*(14+90*Math.pow(k,1.6))+r.range(0,8),w:8+9*k,lean:r.range(-5,5),tE:TS+.03+k*(TH-TS-.08),p:pal2})}
  for(let i=0;i<26;i++){const k=i/25;small.push({k,x:x0+dir*(k*(L+10))+r.range(-5,5),y:GY+3,h:5+r()*9+k*6,w:5+r()*3,lean:r.range(-3,3),tE:TS+.06+k*(TH-TS-.06),p:pal2})}
  const crackA=1-E.ph(t,TSH+.3,TSH+.9),headK=E.eIO(E.ph(t,TS,TH)),head=x0+dir*L*headK;
  /* tụ lạnh dưới chân người đánh */
  if(t<TS+.3){
   const c=E.ph(t,0,.2);
   E.glow(g,x0,GY-4,34*E.eOut(c),col,.55*(1-E.ph(t,.2,.42)));
   E.wave(g,x0,GY,8+26*E.eOut(E.ph(t,0,.3)),col,(1-E.ph(t,.1,.4))*.85,1.6,{seed:s.seed,t:T});
   for(let n=E.rate(s,'ch',E.ph(t,0,.2),30);n>0;n--)E.emit({x:x0+r.range(-18,18),y:GY-r.range(0,6),vx:r.range(-10,10),vy:r.range(-40,-14),life:r.range(.4,.8),s0:r.range(2,3.5),s1:.5,shape:r()<.5?'flake':'spark',c:col,c2:'#ffffff',a:.9,add:true,tag:'fx',rot:r()*6,vr:r.range(-4,4)});
  }
  /* sương băng phủ mặt đất dọc đường đi */
  for(let i=0;i<9;i++){const k=i/8,p=E.ph(t,TS+k*(TH-TS),TS+k*(TH-TS)+.3);
   if(p>0)E.blob(g,x0+dir*L*k,GY+1,32,5,col,.38*p*crackA,T,s.seed+i,{wob:.4,core:'#dff6ff'})}
  /* vết nứt đất chạy theo mũi băng + nhánh */
  if(t>TS&&crackA>0){
   const rc=E.rng(s.seed^0x51ed),pts=E.jag(rc,x0,GY+3,head,GY+3,18,3);
   g.save();g.globalCompositeOperation='lighter';g.lineCap='round';g.lineJoin='round';g.strokeStyle=E.rgba('#dff6ff',.8*crackA);g.lineWidth=2;
   g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();
   g.lineWidth=1.4;g.strokeStyle=E.rgba('#9fe4ff',.6*crackA);
   for(let i=2;i<pts.length-1;i++){const p=pts[i],sg=rc.sign(),l=rc.range(8,20);g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(p[0]+sg*dir*l*.4,p[1]+sg*l*.35);g.lineTo(p[0]+sg*dir*l*.9,p[1]+sg*l*.2);g.stroke()}
   g.restore();
   E.glow(g,head,GY-8,24,col,.5*(1-E.ph(t,TH,TH+.2)));
  }
  /* vẽ gai: hàng sau → hàng chính (+ cụm quanh mục tiêu) → hàng trước */
  const drawRow=(a,id,burstN)=>a.forEach((c,i)=>{
   if(t<c.tE)return;
   const ts=TSH+(1-c.k)*.22+(i%3)*.02,vis=1-E.ph(t,ts,ts+.05);
   if(vis>0){
    const hh=c.h*E.eBack(E.ph(t,c.tE,c.tE+.24));
    E.crystal(g,c.x,c.y,c.w,hh,c.lean,c.p,vis*(c.hi?.88:1),{crack:E.ph(t,c.tE+.15,c.tE+.4),shine:Math.sin(T*4+c.k*9+i)*.5+.5});
   }
   if(id!=='s'&&E.once(s,id+'e'+i)){
    const re=E.rng(s.seed+i*31+id.charCodeAt(0));
    E.burst(re,c.x,c.y,4,{speed:[30,90],ang:[-Math.PI,0],size:[2,3.5],life:[.5,.9],gy:240,drag:.4,shape:'shard',c:c.p.mid,c2:c.p.light,a:.9,tag:'fx',vr:[-8,8],floor:GY+4,bounce:.3});
    E.burst(re,c.x,c.y-2,1,{speed:[4,16],ang:[-Math.PI,0],size:[10,16],life:[.7,1.2],gy:-10,drag:1,shape:'mist',c:'#cfeeff',a:.7,tag:'fx'});
   }
   if(t>=ts&&E.once(s,id+'s'+i)){
    const rb=E.rng(s.seed+i*77+id.charCodeAt(0)*13);
    E.burst(rb,c.x,c.y-c.h*.5,burstN,{speed:[40,150],ang:[-Math.PI*.95,-Math.PI*.05],size:[3,6],life:[.7,1.3],gy:260,drag:.6,shape:'shard',c:c.p.mid,c2:c.p.light,a:.95,tag:'fx',vr:[-9,9],floor:GY+4,bounce:.3});
    if(id==='m')E.burst(rb,c.x,c.y-c.h*.8,2,{speed:[10,50],size:[2,3],life:[.5,.9],gy:40,drag:1,shape:'spark',c:'#ffffff',c2:'#ffffff',a:1,add:true,tag:'fx',vr:[-4,4]});
    if(id!=='s')E.burst(rb,c.x,c.y-c.h*.4,1,{speed:[10,40],ang:[-Math.PI,0],size:[14,22],life:[1.2,2],gy:-8,drag:1,shape:'mist',c:'#bfe8ff',a:.8,tag:'fx'});
   }
  });
  drawRow(back,'b',4);drawRow(main,'m',6);drawRow(small,'s',2);
  /* khi đòn trúng: quầng lạnh nhẹ + sóng băng quanh mục tiêu (không chớp trắng) */
  if(t>TH-.1){
   E.glow(g,tx,GY-36,64,col,.3*E.ph(t,TH-.1,TH)*(1-E.ph(t,TH+.1,TH+.6)));
   E.wave(g,tx,GY,10+100*E.eOut(E.ph(t,TH-.1,TH+.7)),col,(1-E.ph(t,TH+.1,TH+.7))*.85,2,{seed:s.seed+5,t:T});
   E.wave(g,tx,GY,6+60*E.eOut(E.ph(t,TH-.05,TH+.5)),'#ffffff',(1-E.ph(t,TH+.1,TH+.5))*.5,1.2,{seed:s.seed+9,t:T});
  }
  /* bông tuyết rơi + hơi lạnh tan chậm sau khi vỡ */
  if(t>=TSH+.1&&E.once(s,'snow')){
   const rs=E.rng(s.seed^777);
   [.25,.55,.85].forEach(f=>E.burst(rs,x0+dir*L*f,60,14,{jx:50,jy:14,speed:[2,14],ang:[1.2,1.9],size:[3,5],life:[1.3,2.3],gy:28,drag:.4,shape:'flake',c:'#ffffff',a:.9,tag:'fx',vr:[-2,2]}));
  }
  E.draw(g,'fx');
 }
};
/* ---- vòng lặp ---- */
const ATK=1.4,IMP=1.1;
let t0=performance.now(),run=true;
function restart(){t0=performance.now();run=true;if(FX)FX.engine.clear()}
$('play').onclick=restart;$('zone').onchange=restart;$('side').onchange=restart;
$('spd').onchange=()=>{if(FX)FX.engine.setSpeed(+$('spd').value);restart()};
function loop(now){
 requestAnimationFrame(loop);
 if(!FX)return;
 const px=$('style').value==='px',c=px?pg:g;
 if(px)c.setTransform(1/PS,0,0,1/PS,0,0);else{g.setTransform(cv.width/CW,0,0,cv.width/CW,0,0)}
 const sp=+$('spd').value,t=(now-t0)/1000*sp,T=now/1000,zv=$('zone').value,eng=zv==='E',zi=eng?0:+zv,pa=$('side').value==='p';
 const zn=eng?null:FX.zones[zi],hitU=eng?0:(zn.mode==='melee'?.6:.45),tHit=hitU*ATK,total=eng?TOTAL_E:tHit+IMP+.5;
 const bg=c.createLinearGradient(0,0,0,CH);bg.addColorStop(0,'#26324f');bg.addColorStop(.7,'#3b4a63');bg.addColorStop(1,'#1f2a1f');
 c.fillStyle=bg;c.fillRect(0,0,CW,CH);c.fillStyle='#2e3d2c';c.fillRect(0,GY-2,CW,CH-GY+2);
 pet(c,85,'#6cc4ff','#2a6fb0',T,false);pet(c,272,'#ff8a7a','#a83a3a',T,true);
 let msg='';
 try{
  if(run){
   if(eng)ET.run(c,T,t,pa);
   else{
    const u=Math.min(1,t/ATK),q=t>=tHit?Math.min(.9999,(t-tHit)/IMP):-1;
    FX.drawAttack(c,T,{s:zi,u:u,pa:pa,text:'',miss:false});if(q>=0)FX.drawImpact(c,{s:zi,q:q,k:'hit',pp:pa,i:1,text:''},T);
   }
  }
  if(run&&t>total){if($('loop').checked){restart()}else run=false}
 }catch(e){msg='Lỗi: '+e.message}
 if(px){
  /* pixel: vẽ ở độ phân giải thấp (1/2), giới hạn 6 mức/kênh (216 màu), phóng to không làm mịn */
  c.setTransform(1,0,0,1,0,0);
  const id=pg.getImageData(0,0,pxc.width,pxc.height),d=id.data;
  for(let i=0;i<d.length;i+=4){d[i]=Math.round(d[i]/51)*51;d[i+1]=Math.round(d[i+1]/51)*51;d[i+2]=Math.round(d[i+2]/51)*51}
  pg.putImageData(id,0,0);
  g.setTransform(1,0,0,1,0,0);g.imageSmoothingEnabled=false;g.drawImage(pxc,0,0,cv.width,cv.height);
 }
 info.textContent=(msg||(eng?'Tuyết Nguyên (bản thử): dải băng mọc từ chân người đánh tới mục tiêu rồi vỡ.':'Đây là hiệu ứng CŨ (ảnh) để so sánh; sẽ được vẽ lại ở các bước sau.'))+'\nHạt đang chạy: '+FX.engine.count();
}
requestAnimationFrame(loop);
</script>
</body></html>
