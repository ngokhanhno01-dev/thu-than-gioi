<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../">
<title>FX Demo — Thú Thần Giới</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:8px;background:#120c1a;color:#f3e9ff;font:14px/1.4 system-ui,sans-serif;text-align:center}
h1{font-size:16px;margin:4px 0 8px}
canvas{display:block;margin:0 auto;border:1px solid #3a2a55;border-radius:8px;background:#000;touch-action:manipulation}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:8px auto;max-width:720px}
select,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #5a3f86;background:#2a1d40;color:#fff;min-height:44px}
button{background:#6a3fc4;font-weight:700}
label{display:flex;align-items:center;gap:6px}
#info{font-size:12px;color:#b9a7d6;min-height:34px;white-space:pre-wrap}
</style></head><body>
<h1>Trang xem thử hiệu ứng (vẽ bằng code)</h1>
<canvas id="cv"></canvas>
<div class="row"><select id="zone"></select><select id="side"><option value="p">Thú đánh quái</option><option value="m">Quái đánh thú</option></select></div>
<div class="row"><select id="kind"><option value="hit">Đòn thường</option><option value="crit">Chí mạng</option><option value="miss">Trượt (né)</option></select><select id="style"><option value="px">Kiểu: Pixel</option><option value="sm">Kiểu: Mịn</option></select><select id="spd"><option value="1">Tốc độ 1x</option><option value="0.5">Chậm 0.5x</option><option value="0.25">Rất chậm 0.25x</option></select></div>
<div class="row"><button id="play">▶ Phát lại</button><label><input type="checkbox" id="loop" checked> Lặp</label></div>
<div id="info"></div>
<script src="31-combat-fx.js"></script>
<script src="33-attack-fx.js"></script>
<script>
'use strict';
/* Trang này gọi ĐÚNG cách game gọi: TTGCombatFX.drawAttack(g,T,S) khi u<.9 và TTGCombatFX.drawImpact(g,fx,T) khi u≥.35 (trúng ở u=.35, mỗi đòn kéo dài 1.9s).
   Vùng đánh GẦN: thú/quái lao tới như trong game (hàm lungeAt chép từ 06-mobs.js). Vùng đánh XA: giật lùi nhẹ khi bắn (fxRecoil). */
const FX=window.TTGCombatFX,CW=360,CH=250,GY=204,BST=1.9;
const cv=document.getElementById('cv'),g=cv.getContext('2d'),info=document.getElementById('info');
const $=id=>document.getElementById(id);
function fit(){const w=Math.min(innerWidth-16,720),d=Math.min(window.devicePixelRatio||1,3);cv.style.width=w+'px';cv.style.height=(w*CH/CW)+'px';cv.width=Math.round(w*d);cv.height=Math.round(w*d*CH/CW)}
fit();addEventListener('resize',fit);
if(!FX){info.textContent='Không tải được 31-combat-fx.js'}
else{
 const sel=$('zone');
 const build=()=>{sel.innerHTML=FX.zones.map((z,i)=>'<option value="'+i+'">'+i+' · '+z.name+' ('+(z.mode==='melee'?'gần':'xa')+')'+(FX.codeZone&&FX.codeZone(i)?' — VẼLAI BẰNG CODE':' — cũ (ảnh)')+'</option>').join('')};
 build();setTimeout(build,600);   /* 33-attack-fx.js tự gắn codeZone sau khi tải xong */
}
/* ---- chuyển động lao tới / giật lùi: chép từ 06-mobs.js để demo giống game ---- */
function lungeAt(u){if(u<=0)return 0;
 if(u<.14)return -14*Math.sin(u/.14*Math.PI/2);
 if(u<.35){const t=(u-.14)/.21;return -14+(100+14)*t*t*(1.4-.4*t)}
 if(u<.42)return 100;
 if(u<.72){const t=(u-.42)/.3,sm=t*t*(3-2*t);return 100*(1-sm)}
 return 0}
function recoilAt(u){if(u<.05)return 0;
 if(u<.2){const t=(u-.05)/.15;return -5*t*t}
 if(u<.27){const t=(u-.2)/.07;return -5-12*t}
 if(u<.55){const t=(u-.27)/.28,sm=t*t*(3-2*t);return -17*(1-sm)}
 return 0}
/* ---- thú giả để có chỗ đánh ---- */
function pet(g,x,c1,c2,T,flip){
 const b=Math.sin(T*3+x)*1.5;
 g.save();g.translate(x,0);if(flip)g.scale(-1,1);
 g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(0,GY,26,6,0,0,6.283);g.fill();
 const gr=g.createLinearGradient(0,GY-62,0,GY);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;
 g.beginPath();g.ellipse(0,GY-30+b,24,30,0,0,6.283);g.fill();
 g.fillStyle='#fff';g.beginPath();g.arc(8,GY-40+b,6,0,6.283);g.arc(-4,GY-40+b,6,0,6.283);g.fill();
 g.fillStyle='#111';g.beginPath();g.arc(10,GY-40+b,3,0,6.283);g.arc(-2,GY-40+b,3,0,6.283);g.fill();
 g.restore();
}
/* ---- vòng lặp ---- */
let t0=performance.now(),run=true;
function restart(){t0=performance.now();run=true;if(FX)FX.engine.clear()}
$('play').onclick=restart;$('zone').onchange=restart;$('side').onchange=restart;$('kind').onchange=restart;
$('style').onchange=()=>{if(FX.setFxStyle)FX.setFxStyle($('style').value);restart()};
$('spd').onchange=()=>{restart()};
function loop(now){
 requestAnimationFrame(loop);
 if(!FX)return;
 g.setTransform(cv.width/CW,0,0,cv.width/CW,0,0);
 const sp=+$('spd').value,t=(now-t0)/1000*sp,T=now/1000,zi=+$('zone').value||0,pa=$('side').value==='p',kind=$('kind').value;
 window.BSPD=sp<1?1:sp;FX.engine.setSpeed(sp);
 const bg=g.createLinearGradient(0,0,0,CH);bg.addColorStop(0,'#26324f');bg.addColorStop(.7,'#3b4a63');bg.addColorStop(1,'#1f2a1f');
 g.fillStyle=bg;g.fillRect(0,0,CW,CH);g.fillStyle='#2e3d2c';g.fillRect(0,GY-2,CW,CH-GY+2);
 const u=Math.min(1,t/BST);let dp=0,dmx=0,msg='';
 try{
  if(run&&u<.9){
   const z=FX.zones[zi],melee=z&&z.mode==='melee',lg=melee?lungeAt(u)*(kind==='miss'?.6:1):recoilAt(u);
   if(pa)dp=lg;else dmx=-lg;
  }
 }catch(e){msg='Lỗi: '+e.message}
 /* bên bị đánh: né = lùi 16px (giống 06-mobs.js) kèm tàn ảnh; chí mạng/trúng = bị đẩy lùi + giật */
 const ddf=w=>16*Math.sin(Math.PI*Math.max(0,Math.min(1,(w-.28)/.42)));
 let ghosts=[];
 if(run&&u<.9){
  if(kind==='miss'){const dd=ddf(u);if(pa)dmx+=dd;else dp-=dd;
   if(dd>1&&u<.8)for(let k=1;k<=6;k++){const o2=ddf(u-k*.028);if(Math.abs(dd-o2)>1.2)ghosts.push({defP:!pa,off:-o2,a:.55*(1-(k-1)/6)})}}
  else if(u>=.35){const hu=u-.35,big=kind==='crit'?1.7:1,kb=24*big*Math.pow(Math.max(0,1-hu/.4),2),jt=hu<.25?Math.sin(T*70)*4*big*(1-hu/.25):0;if(pa)dmx+=kb+jt;else dp-=kb+jt}
 }
 ghosts.forEach(q=>{g.save();g.globalAlpha=q.a;if(q.defP)pet(g,85+q.off*.84,'#9fd8ff','#9fd8ff',T,false);else pet(g,272-q.off*.78,'#ffb0a0','#ffb0a0',T,true);g.restore()});
 pet(g,85+dp*.84,'#6cc4ff','#2a6fb0',T,false);pet(g,272+dmx*.78,'#ff8a7a','#a83a3a',T,true);
 try{if(run&&u<.9&&kind==='miss'&&FX.drawDodge)FX.drawDodge(g,u,pa,T)}catch(e){msg='Lỗi: '+e.message}
 try{
  if(run&&u<.9){
   const S={on:1,s:zi,u:u,pa:pa,cl:0,cr:kind==='crit',miss:kind==='miss',h:'Thủy',i:1,text:''};
   if(u>=.35)FX.drawImpact(g,{pp:pa,q:Math.min(.9999,(u-.35)/.55),k:kind,d:12,r:1,i:1,h:'Thủy',s:zi,cl:0,text:''},T);
   FX.drawAttack(g,T,S);
  }
  if(run&&u>=1){if($('loop').checked)restart();else run=false}
 }catch(e){msg='Lỗi: '+e.message}
 info.textContent=(msg||(FX.codeZone&&FX.codeZone(zi)?'Vùng này đã vẽ bằng code (không ảnh).':'Đây là hiệu ứng CŨ (ảnh) để so sánh; sẽ được vẽ lại ở các bước sau.'))+'\nHạt đang chạy: '+FX.engine.count();
}
requestAnimationFrame(loop);
</script>
</body></html>
